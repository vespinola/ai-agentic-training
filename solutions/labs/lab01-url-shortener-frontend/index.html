<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">Lab 01</p>
    <h1>URL Shortener</h1>
    <p class="intro">Paste a long URL, generate a short link, and review your recent history from the Railway backend.</p>

    <form id="shortener-form">
      <label class="label" for="url-input">Long URL</label>
      <input
        id="url-input"
        type="url"
        name="url"
        placeholder="https://example.com/very/long/url"
        required
      />
      <div class="actions">
        <button class="primary" id="submit-btn" type="submit">Create Short URL</button>
        <button class="secondary" id="copy-btn" type="button" disabled>Copy Result</button>
      </div>
    </form>

    <div class="status" id="status"></div>

    <section class="panel" id="result-panel">
      <div class="panel-title">Short URL</div>
      <a class="result-url" id="result-url" href="#" target="_blank" rel="noreferrer"></a>
    </section>

    <section class="history">
      <div class="history-header">
        <h2>Previous short links</h2>
        <button class="ghost" id="refresh-btn" type="button">Refresh</button>
      </div>
      <p class="history-empty" id="history-empty">No links created yet.</p>
      <ul class="history-list" id="history-list"></ul>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
